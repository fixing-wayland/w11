#cloud-config
# vmctl flavor fedora43-gnome: Fedora 43 Cloud + the Workstation environment, GNOME Shell 49 --
# the one shell generation between the rig's 46 and 50 that nothing in this project has ever
# run.  GDM autologin, Mutter's DisplayConfig as the oracle, everything else as fedora44-gnome.
#
# On demand, and the honest expectation is a REFUSAL: gnome/w11-overlap@w11/
# generations.json carries records for 46, 50 and 51 and none for 49, and the extension refuses
# any generation it has no measurement for.  That refusal is the thing worth seeing once per
# release -- it is the difference between "the overlap route declines politely on an unmeasured
# GNOME" and "it does something on one".  The bridge and every ordinary tool are expected to
# work; only the overlap phase is expected to decline.
#
# The base image's checksum is NOT pinned here.  Fedora 43-1.6 is the name read off the release
# index and this host has never downloaded it [recon2/cosmic]; scripts/ci-golden.sh checks a
# download against the published CHECKSUM file, and `# vmctl-base-sha256:` goes in the day
# somebody has the bytes.
#
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public key; the
# contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: Fedora-Cloud-Base-Generic-43-1.6.x86_64.qcow2
# vmctl-desktop: gnome
# vmctl-distro: fedora
# vmctl-ci: push
hostname: fedora43-gnome
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [wheel]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  # No `owner:` on any entry here.  write_files runs BEFORE the users module, so
  # `owner: test:test` aborts the whole module with `OSError: Unknown user or
  # group ... 'test'` and cloud-init ends in status: error [recon2/hyprland].
  # Everything under /home/test is chowned by the build script instead.
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=fedora43-gnome
      DESKTOP=gnome
      DESKTOP_PKG="workstation-product-environment"
      EXTRA_PKGS="xdotool wmctrl xprop xrandr wl-mirror python3-gobject gtk3 acl xterm"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
