#cloud-config
# vmctl flavor arch-kde: Arch Linux (the 20260901 cloud image) + Plasma 6.7.4 / KWin 6.7.4 on
# Wayland, SDDM autologin into /usr/share/wayland-sessions/plasma.desktop.  Native display
# tool: kscreen-doctor -o (kscreen 6.7.4).
#
# On demand, for the same reason as arch-gnome: Ubuntu's 6.6 and Fedora's 6.7 already bracket
# the Plasma generations, and a rolling golden rots.  Measured on the recon's guest with
# nothing installed: wxrandr picks the kwin backend over kde_output_management_v2 version 21,
# wwmctl -lGpx lists plasmashell's two blank-titled rows (README note (d)), wwmctl -d prints
# the single desktop, and wmirror correctly refuses -- KWin advertises neither capture protocol
# [recon2/arch 3.3].  That is the 6.7 registry-object discovery path this project added for
# Plasma 6.7.4, reached on a second distribution.
#
# SDDM here and plasma-login-manager on Fedora: vm/build-image.sh's dm_plasma picks whichever
# the packages actually created, so this yaml says nothing about it.
#
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public key; the
# contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: Arch-Linux-x86_64-cloudimg-20260901.583572.qcow2
# vmctl-desktop: kde
# vmctl-distro: arch
# vmctl-ci: push
hostname: arch-kde
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [wheel]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  # No `owner:` on any entry here.  write_files runs BEFORE the users module, so
  # `owner: test:test` aborts the whole module with `OSError: Unknown user or
  # group ... 'test'` and cloud-init ends in status: error [recon2/hyprland].
  # Everything under /home/test is chowned by the build script instead.
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=arch-kde
      DESKTOP=kde
      DESKTOP_PKG="plasma-desktop plasma-workspace kscreen sddm konsole kate xorg-xwayland"
      EXTRA_PKGS="xdotool wmctrl xorg-xprop xorg-xrandr wl-mirror python-gobject gtk3 acl xterm"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
