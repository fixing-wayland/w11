# Every push, the whole thing, spread as wide as GitHub will let it:
#
#   plan         the file list, the flavor set split by `# vmctl-ci:`, and one image key
#                per Dockerfile
#   image        the unit-test container per Ubuntu release (24.04, 26.04, 26.10) plus the
#                Fedora 44 and Arch ones, built once per change to its Dockerfile, in GHCR
#   lint         ruff (the project's lint-only config), scripts/check-docs.py, bash -n on vm/
#   unit-2404  ONE JOB PER TEST FILE on 24.04, as an unprivileged user in that container
#   unit-2604  the same on 26.04
#   unit-2610  the same on 26.10 (one job per release: a matrix caps at 256 jobs)
#   unit-distro  the WHOLE suite in one job on Fedora 44 and on Arch, one process per file
#                as in `unit`: the same files against another distro's python, dbus and
#                originals
#   parity       tests/test_cli_parity.py and test_wwmctl_cli.py against the flake-pinned
#                xdotool 4.20260303.1 and wmctrl 1.07 (scripts/parity-oracle.sh under nix)
#   parity-arch  the same parity run against ARCH'S OWN xdotool 4.20260303.1 and wmctrl 1.07,
#                which is the one distro shipping the version this clone is written against
#   deb          scripts/build-deb.sh, the fresh package proved to be the tree, then installed
#   deb-install  with apt on each release and every tool answering --version
#   rpm          scripts/build-rpm.sh in the Fedora container, rpmlint, the payload vs the tree
#   rpm-install  dnf install of those rpms on Fedora 43, 44 and rawhide
#   pkgbuild     scripts/build-pkgbuild.sh in the Arch container, namcap, install and remove
#   nix          the five flake packages, `nix run`, tests/test_flake.py live, and the three
#                cheap flake checks (module-eval, tools, nixos-sway)
#   nix-full     the two expensive NixOS VM checks (nixos-gnome, nixos-kde), scope=all only
#   vm           ONE JOB PER FLAVOR of the QEMU rig, KVM on the runner: the golden image from
#                the GHCR cache or built here (ISO installs and the NixOS build included),
#                then vm/live-smoke.sh --pkg --record with the package this run built here
#   recordings   ONE JOB PER FLAVOR again: the capture that rig job left beside its log,
#                replayed through vm/live-smoke.d/fake-vmctl -- the pipeline that turns a
#                run into tests/fixtures/live/*-replay.txt, exercised on every push
#
# NOTHING in this file is continue-on-error. It carried nine such keys until 2026-09-12 and
# every one of them is now either a pin or a measurement: every base image is pinned by
# digest in the `plan` step below, which hashes those digests into the image key so a bump
# rebuilds instead of reusing a cached tag; the Arch image syncs against a frozen
# archive.archlinux.org snapshot instead of a live mirror; Arch's wmctrl 1.07-6 --help was
# counted (6801 bytes, the same as nixpkgs' plain 1.07); and the headless-sway probe passed
# in all four installer jobs of run 34628777544 -- deb-install on three releases, rpm and
# nix in [recon/gaps.md 4], pkgbuild in job 103360336842 of that run, which printed
# `xw11 --print-display: :20 then :20 (upstream DISPLAY=:0)`. A red job here is a red push.
#
# fedora rawhide is NOT built or installed anywhere and that is a gap with a route, not a
# policy: a noarch rpm built on 44 requires `python(abi) = 3.14` and rawhide has moved to
# 3.15 (run 34390127394: "nothing provides python(abi) = 3.14"), so covering rawhide means
# BUILDING there -- a second `rpm` job in a rawhide container, rung 4 of AGENTS.md's
# ladder, perhaps an hour of runner time a push. Not yet, and filed as work.
#
# The rig runs the `# vmctl-ci: push` flavors on a push. The rest -- ISO installs, the
# desktops nobody has measured twice -- go with `workflow_dispatch` and `scope: all`, or by
# putting the `ci:all-flavors` label on a pull request.
name: ci
on:
  push:
  # no pull_request trigger: a pull request from a branch of this repository already runs
  # on its push, and the second run doubled 428 jobs for nothing (run 34629708573)
  workflow_dispatch:
    inputs:
      scope:
        description: which rig flavors to run
        type: choice
        options: [push, all]
        default: push

permissions:
  contents: read
  packages: write

env:
  W11_PASSTHROUGH: never

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.list.outputs.files }}
      flavors: ${{ steps.list.outputs.flavors }}
      scope: ${{ steps.list.outputs.scope }}
      image_key: ${{ steps.list.outputs.image_key }}
      image_key_fedora: ${{ steps.list.outputs.image_key_fedora }}
      image_key_arch: ${{ steps.list.outputs.image_key_arch }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          WANTED: ${{ inputs.scope || 'push' }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:all-flavors') }}
        run: |
          files=$(for f in tests/test_*.py; do basename "$f" .py; done | jq -R . | jq -sc .)
          # the rig runs the flavors whose yaml says `# vmctl-ci: push`; `on-demand` ones (ISO
          # installs, the desktops with one measurement behind them) ride on scope=all or on the
          # `ci:all-flavors` label of a pull request
          push=$(for f in vm/flavors/*.yaml; do grep -q '^# vmctl-ci: push' "$f" && basename "$f" .yaml; done | jq -R . | jq -sc .)
          all=$(for f in vm/flavors/*.yaml; do basename "$f" .yaml; done | jq -R . | jq -sc .)
          # written as `if` and not `[ ... ] && x=y`: a run step is `bash -e`, and a test
          # that is false at the head of an && list is the shape that reads like an error
          scope=$WANTED
          if [ "$LABELLED" = true ]; then scope=all; fi
          if [ "$scope" = all ]; then flavors=$all; else flavors=$push; fi
          # Every base image, pinned by digest, in ONE place: a floating `ubuntu:26.10` or
          # `archlinux:base-devel` is a different image every week, which is the whole of
          # what made four of this file's nine continue-on-error keys look reasonable. The
          # `image` and `deb-install` matrices below repeat these references (a matrix
          # cannot read a variable of this step) and tests/test_ci_images.py compares the
          # lists character for character. They are hashed INTO the image key because the
          # cached image is named after that key: a digest bumped in the matrix alone would
          # find the old tag and build nothing at all.
          u2404=ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
          u2604=ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d
          u2610=ubuntu:26.10@sha256:49077a16b772f8bc6e6f160ad2bfc218919f3455037387ed19a8309174328603
          fed=fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          # the reference is 110 characters on its own, so the dated tag and its digest are
          # joined on a second line rather than written past this file's 120th column
          arch=archlinux:base-devel-20260906.0.587075
          arch=$arch@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
          key=$( { sha256sum .github/ci/Dockerfile; echo "$u2404 $u2604 $u2610"; } | sha256sum | cut -c1-12)
          keyf=$( { sha256sum .github/ci/Dockerfile.fedora; echo "$fed"; } | sha256sum | cut -c1-12)
          keya=$( { sha256sum .github/ci/Dockerfile.arch; echo "$arch"; } | sha256sum | cut -c1-12)
          { echo "files=$files"; echo "flavors=$flavors"; echo "scope=$scope";
            echo "image_key=$key"; echo "image_key_fedora=$keyf"; echo "image_key_arch=$keya"; } >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The same five references the `plan` step above pins and hashes into `key`;
        # tests/test_ci_images.py compares the two lists character for character, so a
        # digest bumped here alone is a red unit test rather than a cached image nobody
        # rebuilt. The arch row runs past 120 columns because the reference alone is 110
        # characters and a matrix value cannot be split.
        include:
          - distro: "24.04"
            base: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
            dockerfile: Dockerfile
            key: ${{ needs.plan.outputs.image_key }}
          - distro: "26.04"
            base: ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d
            dockerfile: Dockerfile
            key: ${{ needs.plan.outputs.image_key }}
          - distro: "26.10"
            base: ubuntu:26.10@sha256:49077a16b772f8bc6e6f160ad2bfc218919f3455037387ed19a8309174328603
            dockerfile: Dockerfile
            key: ${{ needs.plan.outputs.image_key }}
          - distro: fedora44
            base: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            dockerfile: Dockerfile.fedora
            key: ${{ needs.plan.outputs.image_key_fedora }}
          - distro: arch
            base: archlinux:base-devel-20260906.0.587075@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5
            dockerfile: Dockerfile.arch
            key: ${{ needs.plan.outputs.image_key_arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build the image unless GHCR already has this Dockerfile's
        run: |
          tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/w11-ci:${{ matrix.distro }}-${{ matrix.key }}
          if docker manifest inspect "$tag" >/dev/null 2>&1; then echo "have $tag"; exit 0; fi
          docker build --build-arg BASE=${{ matrix.base }} -t "$tag" -f .github/ci/${{ matrix.dockerfile }} .github/ci
          docker push "$tag"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `.` is every package in the tree, xw11/ included; pyproject's extend-exclude
      # is one generated keysym table and nothing else.
      - run: uvx ruff check .
      - run: python3 scripts/check-docs.py
      - run: for f in vm/*.sh vm/live-smoke.d/*.sh scripts/*.sh; do bash -n "$f" || exit 1; done; sh -n gnome/install-bridge.sh; sh -n gnome/install-overlap.sh; sh -n packaging/common/enable-bridge; python3 -m py_compile vm/vmctl

  # One job per test file per release, and one JOB per release: a matrix is capped at 256
  # jobs and three releases times the files in tests/ passed that on 2026-09-09 (105 files,
  # 315 jobs), which GitHub reports as a failed run with no job to show for it.
  unit-2404:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.files) }}
    name: 24.04 ${{ matrix.file }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:24.04-${{ needs.plan.outputs.image_key }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.file }}
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              dbus-run-session -- python3 tests/${{ matrix.file }}.py

  unit-2604:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.files) }}
    name: 26.04 ${{ matrix.file }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:26.04-${{ needs.plan.outputs.image_key }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.file }}
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              dbus-run-session -- python3 tests/${{ matrix.file }}.py

  unit-2610:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.files) }}
    # 26.10 is the development Ubuntu. It was continue-on-error until 2026-09-12 for
    # that word alone, and the run it was measured on says the word was wrong: on run
    # 34628777544 every 26.10 file was green except test_nixos_golden, which failed on
    # 24.04 and 26.04 too [recon/gaps.md 4]. The image is built from a digest-pinned
    # ubuntu:26.10 (the `plan` step above) and cached in GHCR under a key that digest is
    # hashed into, so what runs here moves when somebody moves it.
    name: 26.10 ${{ matrix.file }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:26.10-${{ needs.plan.outputs.image_key }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.file }}
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              dbus-run-session -- python3 tests/${{ matrix.file }}.py

  # One job, the whole suite, on the two distros that are not Debian: the point here is the
  # distro's python, dbus and originals under the same files. One JOB rather than one per
  # file (105 files x 2 distros is not worth the runner minutes), but still one PROCESS per
  # file, which is what `unit` does on every Ubuntu release and what the release gate does
  # not: `python3 -m unittest discover -s tests` shares an interpreter across 105 files and
  # this batch spent its last hours on two state leaks that only that sharing could produce
  # (an `os.environ` replaced by a plain dict, a `gi` cleanup registered in the wrong LIFO
  # order). Three more tests still flake under discover on the author's box and pass run
  # alone; a red Fedora job for a leak in another file is a job nobody reads, and a leak is
  # not what this job is here to measure. The recon measured discover at 234.6 s for the
  # suite in an Arch chroot [recon2/pkg-arch.md]; the loop pays 105 interpreter startups on
  # top of that, measured at 1.0 s in total on the author's box. Arch is rolling, and the
  # arch row of this matrix was continue-on-error for that word until 2026-09-12; the image
  # now builds off a dated base tag and an archive.archlinux.org snapshot of the same date
  # (.github/ci/Dockerfile.arch), so `pacman -Syu` resolves to the same bytes on every
  # build and the row is red when it is red.
  unit-distro:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    # 60 was the budget for a discover of a suite the recon timed at 234.6 s in a chroot
    # with no compositor in it; these images have sway and Xvfb, so the live files run
    # here and the whole thing is minutes, not seconds. 90 is room for a slow runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora44
            image: fedora44-${{ needs.plan.outputs.image_key_fedora }}
          - distro: arch
            image: arch-${{ needs.plan.outputs.image_key_arch }}
    name: ${{ matrix.distro }} every test file
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: every tests/test_*.py, one process each, all of them before the verdict
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              dbus-run-session -- sh -c '
                failed=
                for f in tests/test_*.py; do
                    echo "== $f"
                    python3 "$f" || failed="$failed $f"
                done
                [ -z "$failed" ] || { echo "FAILED:$failed"; exit 1; }
              '

  parity:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # sway, xwayland and foot are for tests/test_xw11_parity.py::NativeParity, which
      # compares the pinned xdotool/wmctrl THROUGH the proxy with the clones on one
      # headless sway; the four before them are the Xvfb half this job has always run.
      - run: sudo find /etc/apt/sources.list.d -type f ! -name ubuntu.sources -delete; sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils xterm wmctrl sway xwayland foot
      - name: the pinned oracles, then scripts/parity-oracle.sh three times
        run: |
          nix build --no-link --print-out-paths --inputs-from . nixpkgs#xdotool nixpkgs#wmctrl > /tmp/oracles
          W11_ORACLE_PATH=$(sed 's|$|/bin|' /tmp/oracles | paste -sd:); export W11_ORACLE_PATH
          sh scripts/parity-oracle.sh
          # ...and again with every byte through a pass-through xw11 on :98. The two runs
          # must differ only in their `Ran N tests in` lines, which is what makes this the
          # framing's regression test rather than a second copy of the first.
          W11_PARITY_PROXY=1 sh scripts/parity-oracle.sh
          # ...and a third time with the proxy in the mode a SESSION runs it in -- no
          # --passthrough, so every request is answered out of the shadow -- in front of a
          # headless sway's Xwayland rather than an Xvfb. Until 2026-09-12 nobody had ever
          # run the byte-parity set against the proxy's own answers; it is byte-identical
          # there too and costs 5.3 s on the author's box, 6.4 s in the recon
          # [recon/recordings.md 2.2]. The packages it needs are the three installed above.
          W11_PARITY_SWAY=1 W11_PARITY_PROXY=native sh scripts/parity-oracle.sh

  # The same comparison against a DISTRO's binary rather than a nix build. Arch is the only
  # one shipping xdotool 4.20260303.1 and wmctrl 1.07, the two versions this project clones
  # [recon2/pkg-arch.md]; Fedora's xdotool is 3.20211022.1, so test_cli_parity SKIPs there
  # [recon2/fedora.md] and there is no fedora twin of this job.
  #
  # The gate that used to make this job continue-on-error is counted now:
  # scripts/parity-oracle.sh wants `wmctrl --help` to be 6801 bytes, which is nixpkgs'
  # plain 1.07 (Ubuntu's 1.07+git20240228 is 7179), and Arch's wmctrl 1.07-6 is 6801 --
  # measured on 2026-09-12 by running the 1.07-6 binary out of the very snapshot this
  # image is pinned to (archive.archlinux.org/repos/2026/09/06). No second accepted size
  # was needed. The job had also SUCCEEDED twice by then, both passes [recon/gaps.md 4].
  parity-arch:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:arch-${{ needs.plan.outputs.image_key_arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: W11_ORACLE_PATH=/usr/bin, then scripts/parity-oracle.sh
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              W11_ORACLE_PATH=/usr/bin dbus-run-session -- sh scripts/parity-oracle.sh
          # the same run with every byte through a pass-through xw11 on :98
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci W11_PASSTHROUGH=never \
              W11_ORACLE_PATH=/usr/bin W11_PARITY_PROXY=1 dbus-run-session -- sh scripts/parity-oracle.sh

  deb:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:24.04-${{ needs.plan.outputs.image_key }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: build the package
        run: |
          git config --global --add safe.directory "$PWD"
          sh scripts/build-deb.sh --no-deps
      # The upload comes BEFORE the release test, in all three package jobs, and run
      # 34662004383 is why: a stale test-count pin in test_release_rpm/test_release_pkgbuild
      # failed those jobs, nothing was uploaded, and twelve fedora-*/arch-* rig jobs then
      # died at `download-artifact` with "Artifact not found" -- twelve desktops that
      # measured nothing because of a number in a unit test. The job still goes red on its
      # own test below; what changes is that the rigs get the package that was built.
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: release/*.deb
      - name: the package is the tree
        run: python3 tests/test_release_deb.py

  deb-install:
    needs: [plan, image, deb]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # By digest, and the same three references the `plan` step pins -- they are written
      # twice because a matrix cannot read that step's shell, and tests/test_ci_images.py
      # compares the two lists character for character. A plain
      # `ubuntu:26.10` here is a different image every week, which is the whole of what
      # made this job's 26.10 row continue-on-error until 2026-09-12; it had SUCCEEDED
      # on run 34628777544 all the same [recon/gaps.md 4]. What is still live here is
      # the apt archive the step below updates from (ca-certificates, sway, xwayland);
      # if a 26.10 archive ever breaks this job the route is snapshot.ubuntu.com in a
      # sources.list, the same trick the Arch image plays with archive.archlinux.org --
      # not yet, because it has never happened.
      matrix:
        include:
          - distro: "24.04"
            image: ubuntu:24.04@sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254
          - distro: "26.04"
            image: ubuntu:26.04@sha256:513c074113a871b51a8d16ab445c88779d6452d937a164fb5cc479f32668a41d
          - distro: "26.10"
            image: ubuntu:26.10@sha256:49077a16b772f8bc6e6f160ad2bfc218919f3455037387ed19a8309174328603
    name: apt install on ${{ matrix.distro }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: apt install, then every tool answers
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
          apt-get install -y ./w11_*.deb
          for t in wdotool wwmctl wxprop wxrandr warandr wmirror; do printf '%s: ' $t; $t --version 2>&1 | head -1; done
          ls /usr/share/gnome-shell/extensions/ /usr/lib/udev/rules.d/60-w11-uinput.rules \
             /etc/xdg/autostart/w11-enable-bridge.desktop /usr/lib/w11/enable-bridge
      # The proxy against a real compositor, in the container that has just built or
      # installed it. A headless sway needs no seat, no DRM and no /dev/dri
      # (WLR_BACKENDS=headless), which makes this the cheapest place the whole thing can
      # run: sway with xwayland on, then `xw11 --print-display` twice. It must print the
      # SAME `:N` both times -- a session has one proxy, and the display file under
      # $XDG_RUNTIME_DIR is what the second call finds instead of starting a second.
      # Measured in exactly this shape on the development box on 2026-09-11 against sway
      # 1.11 and Xwayland 24.1.10: `:20` twice, and the original `xdotool
      # getdisplaygeometry` through it printed `1280 720`.
      # It was continue-on-error until 2026-09-12, the way parity-arch carried its own
      # unmeasured gate. The measurement has been taken: on run 34628777544 this step
      # passed in every job that carries it -- deb-install on all three Ubuntu releases,
      # rpm, and nix [recon/gaps.md 4] -- so the marker came off and a proxy that cannot
      # start in a container turns the push red, which is what it is for.
      - name: xw11 --print-display under a headless sway
        run: |
          # this container has no unprivileged user, so sway runs as root here
          apt-get install -y -qq --no-install-recommends sway xwayland >/dev/null
          cat > /tmp/xw11-probe.sh <<'PROBE'
          set -eu
          : "${XW11:=xw11}"
          RT=${XDG_RUNTIME_DIR:-/tmp/xdg-xw11}; mkdir -p "$RT"; chmod 700 "$RT"
          export XDG_RUNTIME_DIR=$RT WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          printf '%s\n' 'output HEADLESS-1 mode 1280x720' 'xwayland enable' \
              "exec sh -c 'echo \"\$DISPLAY\" > $RT/display'" > "$RT/sway.conf"
          sway -c "$RT/sway.conf" >/dev/null 2>&1 &
          SWAYPID=$!
          # by pid and never by pattern, on the `set -eu` exits as well as the end: a probe
          # that leaves a compositor and its Xwayland running belongs to the rest of the job.
          trap 'kill $SWAYPID 2>/dev/null || true' EXIT
          i=0; while [ "$i" -lt 30 ] && [ ! -s "$RT/display" ]; do i=$((i + 1)); sleep 1; done
          DISPLAY=$(cat "$RT/display"); export DISPLAY
          SWAYSOCK=$(ls "$RT"/sway-ipc.*.sock | head -1); export SWAYSOCK
          a=$($XW11 --print-display)
          b=$($XW11 --print-display)
          echo "xw11 --print-display: $a then $b (upstream DISPLAY=$DISPLAY)"
          [ -n "$a" ]
          [ "$a" = "$b" ]
          $XW11 --stop
          PROBE
          sh /tmp/xw11-probe.sh
      - name: apt remove, and nothing of ours left on PATH
        run: apt-get remove -y w11 >/dev/null && ! command -v wdotool

  # The rpm half of `deb`. Three noarch rpms out of one build, rpmlint against the checked-in
  # rpmlintrc, and tests/test_release_rpm.py comparing the payload with the tree; the
  # artifact is what the fedora44-* rig jobs install with --pkg.
  rpm:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:fedora44-${{ needs.plan.outputs.image_key_fedora }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: scripts/build-rpm.sh --no-deps --lint
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci W11_PASSTHROUGH=never \
              sh scripts/build-rpm.sh --no-deps --lint
      # before the release test, for the reason written out in the `deb` job: run
      # 34662004383 lost six fedora rigs to a test-count pin that ran first
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: dist/*.rpm
      - name: the payload against the tree
        run: |
          runuser -u ci -- env HOME=/home/ci W11_PASSTHROUGH=never \
              python3 tests/test_release_rpm.py
      # The proxy against a real compositor, in the container that has just built or
      # installed it. A headless sway needs no seat, no DRM and no /dev/dri
      # (WLR_BACKENDS=headless), which makes this the cheapest place the whole thing can
      # run: sway with xwayland on, then `xw11 --print-display` twice. It must print the
      # SAME `:N` both times -- a session has one proxy, and the display file under
      # $XDG_RUNTIME_DIR is what the second call finds instead of starting a second.
      # Measured in exactly this shape on the development box on 2026-09-11 against sway
      # 1.11 and Xwayland 24.1.10: `:20` twice, and the original `xdotool
      # getdisplaygeometry` through it printed `1280 720`.
      # It was continue-on-error until 2026-09-12, the way parity-arch carried its own
      # unmeasured gate. The measurement has been taken: on run 34628777544 this step
      # passed in every job that carries it -- deb-install on all three Ubuntu releases,
      # rpm, and nix [recon/gaps.md 4] -- so the marker came off and a proxy that cannot
      # start in a container turns the push red, which is what it is for.
      - name: xw11 --print-display under a headless sway
        run: |
          # the tree's own xw11: this job builds the rpm, rpm-install is what installs one
          cat > /tmp/xw11-probe.sh <<'PROBE'
          set -eu
          : "${XW11:=xw11}"
          RT=${XDG_RUNTIME_DIR:-/tmp/xdg-xw11}; mkdir -p "$RT"; chmod 700 "$RT"
          export XDG_RUNTIME_DIR=$RT WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          printf '%s\n' 'output HEADLESS-1 mode 1280x720' 'xwayland enable' \
              "exec sh -c 'echo \"\$DISPLAY\" > $RT/display'" > "$RT/sway.conf"
          sway -c "$RT/sway.conf" >/dev/null 2>&1 &
          SWAYPID=$!
          # by pid and never by pattern, on the `set -eu` exits as well as the end: a probe
          # that leaves a compositor and its Xwayland running belongs to the rest of the job.
          trap 'kill $SWAYPID 2>/dev/null || true' EXIT
          i=0; while [ "$i" -lt 30 ] && [ ! -s "$RT/display" ]; do i=$((i + 1)); sleep 1; done
          DISPLAY=$(cat "$RT/display"); export DISPLAY
          SWAYSOCK=$(ls "$RT"/sway-ipc.*.sock | head -1); export SWAYSOCK
          a=$($XW11 --print-display)
          b=$($XW11 --print-display)
          echo "xw11 --print-display: $a then $b (upstream DISPLAY=$DISPLAY)"
          [ -n "$a" ]
          [ "$a" = "$b" ]
          $XW11 --stop
          PROBE
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci \
              PYTHONPATH="$PWD" XW11="python3 -m xw11" sh /tmp/xw11-probe.sh

  rpm-install:
    needs: [plan, rpm]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # not rawhide: a noarch rpm built on 44 requires python(abi) = 3.14 and rawhide has
        # moved on (run 34390127394: "nothing provides python(abi) = 3.14"); installing there
        # means building there, which is a job of its own when someone wants it.
        #
        # By digest, for the reason deb-install's three are: this job has never been
        # continue-on-error, but "a plain tag is a different image every week" is as true of
        # `fedora:44` as it was of `ubuntu:26.10`, and 44's digest is the one the `rpm` job
        # BUILT the package in. What is still live here is dnf's own archive, the way apt's
        # is in deb-install -- not yet pinned, and never a failure so far.
        include:
          - tag: "43"
            image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
          - tag: "44"
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    name: dnf install on fedora ${{ matrix.tag }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
      - name: dnf install, then every tool answers
        run: |
          dnf -y install ./w11-*.noarch.rpm ./gnome-shell-extension-w11-*.noarch.rpm
          for t in wdotool wwmctl wxprop wxrandr warandr wmirror; do printf '%s: ' $t; $t --version 2>&1 | head -1; done
          ls /usr/share/gnome-shell/extensions/ /usr/lib/udev/rules.d/60-w11-uinput.rules \
             /etc/xdg/autostart/w11-enable-bridge.desktop /usr/libexec/w11/enable-bridge
          # what the package says it installed against what is on disk: mode, size, digest
          # and mtime of every file of all three rpms. Silent and exit 0 when they agree;
          # the %ghost stamp %post writes is skipped by rpm's own verification, which is
          # why it is a %ghost. A scriptlet that edits a packaged file shows up here.
          for p in w11 gnome-shell-extension-w11-bridge gnome-shell-extension-w11-overlap; do
              printf 'rpm -V %s: ' "$p"; rpm -V "$p" && echo ok
          done
          dnf -y remove w11 >/dev/null && ! command -v wdotool

  # Arch in one job -- build, namcap, install, every tool answers, remove -- because makepkg
  # cannot run as root and the container already has the `ci` user that cannot either.
  # It was continue-on-error for the reason the arch-* rig flavors were: `pacman -Syu`
  # pinned nothing. The image it runs in now syncs against a frozen
  # archive.archlinux.org/repos/2026/09/06 snapshot off a base tag of the same date
  # (.github/ci/Dockerfile.arch), so the packages under this job are the same bytes on
  # every build and the marker came off on 2026-09-12. It had SUCCEEDED on run
  # 34628777544 [recon/gaps.md 4].
  pkgbuild:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository_owner }}/w11-ci:arch-${{ needs.plan.outputs.image_key_arch }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init
    steps:
      - uses: actions/checkout@v4
      - name: scripts/build-pkgbuild.sh --no-deps --lint
        run: |
          chown -R ci "$PWD"
          runuser -u ci -- env HOME=/home/ci W11_PASSTHROUGH=never \
              sh scripts/build-pkgbuild.sh --no-deps --lint
      # before the release test, for the reason written out in the `deb` job: run
      # 34662004383 lost six arch rigs to a test-count pin that ran first
      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: dist/*.pkg.tar.zst
      - name: the payload against the tree, then pacman -U and -R
        run: |
          runuser -u ci -- env HOME=/home/ci W11_PASSTHROUGH=never \
              python3 tests/test_release_pkgbuild.py
          pacman -U --noconfirm dist/w11-*.pkg.tar.zst
          for t in wdotool wwmctl wxprop wxrandr warandr wmirror; do printf '%s: ' $t; $t --version 2>&1 | head -1; done
          ls /usr/share/gnome-shell/extensions/ /usr/lib/udev/rules.d/60-w11-uinput.rules \
             /etc/xdg/autostart/w11-enable-bridge.desktop /usr/lib/w11/enable-bridge
          # the mtree of the installed package against what is on disk -- pacman's own
          # `rpm -V`, and the same claim: `-Qkk` reads sizes and sha256s and not just
          # presence. The stamp post_install writes lives outside the file list.
          pacman -Qkk w11
          cat > /tmp/xw11-probe.sh <<'PROBE'
          set -eu
          : "${XW11:=xw11}"
          RT=${XDG_RUNTIME_DIR:-/tmp/xdg-xw11}; mkdir -p "$RT"; chmod 700 "$RT"
          export XDG_RUNTIME_DIR=$RT WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          printf '%s\n' 'output HEADLESS-1 mode 1280x720' 'xwayland enable' \
              "exec sh -c 'echo \"\$DISPLAY\" > $RT/display'" > "$RT/sway.conf"
          sway -c "$RT/sway.conf" >/dev/null 2>&1 &
          SWAYPID=$!
          # by pid and never by pattern, on the `set -eu` exits as well as the end: a probe
          # that leaves a compositor and its Xwayland running belongs to the rest of the job.
          trap 'kill $SWAYPID 2>/dev/null || true' EXIT
          i=0; while [ "$i" -lt 30 ] && [ ! -s "$RT/display" ]; do i=$((i + 1)); sleep 1; done
          DISPLAY=$(cat "$RT/display"); export DISPLAY
          SWAYSOCK=$(ls "$RT"/sway-ipc.*.sock | head -1); export SWAYSOCK
          a=$($XW11 --print-display)
          b=$($XW11 --print-display)
          echo "xw11 --print-display: $a then $b (upstream DISPLAY=$DISPLAY)"
          [ -n "$a" ]
          [ "$a" = "$b" ]
          $XW11 --stop
          PROBE
          # the same probe the other three installers run, as the `ci` user, against the
          # xw11 pacman just installed. It passed here on run 34628777544 like the other
          # three -- job 103360336842, `xw11 --print-display: :20 then :20 (upstream
          # DISPLAY=:0)` -- which is the measurement this job's own marker was waiting on.
          # Its failure is REMEMBERED rather than immediate,
          # because `pacman -R` below is this job's other claim and has to be reached
          # either way; the job is no longer continue-on-error, so the last line is what
          # turns a proxy that would not start into a red push, like the other three.
          probe=0
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg-ci sh /tmp/xw11-probe.sh \
              || { probe=1; echo "xw11 --print-display did not run in this container"; }
          pacman -R --noconfirm w11 && ! command -v wdotool
          [ "$probe" = 0 ]

  # The flake, on a runner with nix: the five packages, `nix run`, the live half of
  # tests/test_flake.py, and the three checks that do not boot a NixOS VM. The two that do
  # are `nix-full`, because the recon measured the GNOME one at about fifty minutes of wall
  # clock, nearly all of it substitution [recon2/pkg-nix.md].
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # the same extra-conf the vm job's installer passes: `nixos-sway` below is a NixOS VM
      # test and wants the kvm feature to run at speed. nix adds kvm by itself when the
      # daemon can open /dev/kvm, which an ubuntu-24.04 runner can today -- writing it down
      # is what keeps the job from depending on that quietly [recon2/pkg-nix.md 4 measured
      # the checks with these features set].
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: system-features = nixos-test benchmark big-parallel kvm
      - name: tests/test_flake.py with W11_NIX_LIVE=1
        run: W11_NIX_LIVE=1 W11_PASSTHROUGH=never python3 tests/test_flake.py
      - name: the checks that boot nothing
        run: nix build --no-link -L .#checks.x86_64-linux.module-eval .#checks.x86_64-linux.tools .#checks.x86_64-linux.nixos-sway
      # The proxy against a real compositor, in the container that has just built or
      # installed it. A headless sway needs no seat, no DRM and no /dev/dri
      # (WLR_BACKENDS=headless), which makes this the cheapest place the whole thing can
      # run: sway with xwayland on, then `xw11 --print-display` twice. It must print the
      # SAME `:N` both times -- a session has one proxy, and the display file under
      # $XDG_RUNTIME_DIR is what the second call finds instead of starting a second.
      # Measured in exactly this shape on the development box on 2026-09-11 against sway
      # 1.11 and Xwayland 24.1.10: `:20` twice, and the original `xdotool
      # getdisplaygeometry` through it printed `1280 720`.
      # It was continue-on-error until 2026-09-12, the way parity-arch carried its own
      # unmeasured gate. The measurement has been taken: on run 34628777544 this step
      # passed in every job that carries it -- deb-install on all three Ubuntu releases,
      # rpm, and nix [recon/gaps.md 4] -- so the marker came off and a proxy that cannot
      # start in a container turns the push red, which is what it is for.
      - name: xw11 --print-display under a headless sway
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sway xwayland >/dev/null
          nix build --no-link --print-out-paths .#w11 > /tmp/w11out
          cat > /tmp/xw11-probe.sh <<'PROBE'
          set -eu
          : "${XW11:=xw11}"
          RT=${XDG_RUNTIME_DIR:-/tmp/xdg-xw11}; mkdir -p "$RT"; chmod 700 "$RT"
          export XDG_RUNTIME_DIR=$RT WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman
          printf '%s\n' 'output HEADLESS-1 mode 1280x720' 'xwayland enable' \
              "exec sh -c 'echo \"\$DISPLAY\" > $RT/display'" > "$RT/sway.conf"
          sway -c "$RT/sway.conf" >/dev/null 2>&1 &
          SWAYPID=$!
          # by pid and never by pattern, on the `set -eu` exits as well as the end: a probe
          # that leaves a compositor and its Xwayland running belongs to the rest of the job.
          trap 'kill $SWAYPID 2>/dev/null || true' EXIT
          i=0; while [ "$i" -lt 30 ] && [ ! -s "$RT/display" ]; do i=$((i + 1)); sleep 1; done
          DISPLAY=$(cat "$RT/display"); export DISPLAY
          SWAYSOCK=$(ls "$RT"/sway-ipc.*.sock | head -1); export SWAYSOCK
          a=$($XW11 --print-display)
          b=$($XW11 --print-display)
          echo "xw11 --print-display: $a then $b (upstream DISPLAY=$DISPLAY)"
          [ -n "$a" ]
          [ "$a" = "$b" ]
          $XW11 --stop
          PROBE
          XW11=$(cat /tmp/w11out)/bin/xw11 sh /tmp/xw11-probe.sh

  nix-full:
    needs: plan
    if: ${{ needs.plan.outputs.scope == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: system-features = nixos-test benchmark big-parallel kvm
      - name: the two NixOS VM checks
        run: nix build --no-link -L .#checks.x86_64-linux.nixos-gnome .#checks.x86_64-linux.nixos-kde

  vm:
    needs: [plan, deb, rpm, pkgbuild]
    # `needs` alone skips every dependant when a needed job FAILS, and that is exactly what
    # a Fedora rpm or an Arch pkg build going wrong would do here: 25 Ubuntu rig jobs and 2
    # NixOS ones skipped over a package none of them installs. (Until 2026-09-12 `pkgbuild`
    # could not do that, being continue-on-error, and `rpm` was the one job this condition
    # was written for; now neither is, and it guards both.) A flavor whose own distro's
    # package is missing fails at its download step, which is where a missing package
    # belongs. The condition is the documented way to say "run anyway": plan and deb are
    # the two every flavor really needs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.deb.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    # No continue-on-error since 2026-09-12. It read `stonking-* || arch-*` -- the
    # unreleased Ubuntu and the rolling distro -- and the two halves come off on different
    # evidence, which is worth writing down. stonking-gnome and stonking-kde were green on
    # BOTH of the last two runs, 34628777544 and 34662004383 (the portal call the note
    # worried about is already excused by common.sh:775-781): that is the two consecutive
    # green runs asked for. The four red arch flavors were fixed IN THE TREE in this wave
    # (arch-kde's duplicate titles, COSMIC's id range and workspaces, Hyprland 0.56's
    # apply, arch-river's golden) and no arch rig has run on CI since -- all twelve
    # fedora-*/arch-* jobs of 34662004383 died at `download-artifact`, which the package
    # jobs above are reordered to prevent -- so the first CI measurement of those four is
    # the push after 2026-09-12. If one of them is red there for something this wave did
    # not touch, that is a bug to fix and not a key to put back. Their goldens
    # are built from a dated Arch cloud image (`# vmctl-base:
    # Arch-Linux-x86_64-cloudimg-20260901.583572.qcow2`) and not from the rolling `latest`
    # name, the same way this file's Arch container is pinned. A rig that goes red now is a
    # desktop that broke.
    name: rig ${{ matrix.flavor }}
    env:
      VMDATA: /mnt/vm-data
      VMIMAGES: /mnt/images
      LIVE_SMOKE_BOOT_TIMEOUT: "480"   # an ISO-installed desktop took over 240 s to ssh on a loaded runner
    steps:
      - uses: actions/checkout@v4
      - id: flavor
        name: what this flavor is built from and installs
        run: |
          y=vm/flavors/${{ matrix.flavor }}.yaml
          hdr() { sed -n "s/^#[[:space:]]*$1:[[:space:]]*//p" "$y" | head -1; }
          { echo "distro=$(hdr vmctl-distro)"; echo "nix=$(hdr vmctl-nix)"; } >> "$GITHUB_OUTPUT"
      # the package THIS run built from THIS tree replaces the committed one under release/,
      # so the rig measures the push and not the last release; the rpm and the pkg arrive the
      # same way, into the directories vm/live-smoke.sh reads by default
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'ubuntu'
        with:
          name: deb
          path: release
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'fedora'
        with:
          name: rpms
          path: dist
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'arch'
        with:
          name: pkg
          path: dist
      - name: the host vm/README.md asks for, KVM opened to the runner, /mnt for the images
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name ubuntu.sources -delete; sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-system-gui qemu-utils \
              cloud-image-utils dbus libglib2.0-bin socat imagemagick openssh-client genisoimage jq
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm; qemu-system-x86_64 -display help | grep -w dbus
          sudo install -d -o "$USER" -g "$USER" /mnt/vm-data /mnt/images; df -h /mnt | tail -1
          # to a file first, then extract: a stream that breaks mid-way left tar with a
          # truncated archive and the whole rig job red (run 34388409584, noble-kde-x11)
          for i in 1 2 3; do
            curl -fsSL --retry 3 -o /tmp/oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
              && sudo tar -xzf /tmp/oras.tgz -C /usr/local/bin oras && break
            sleep 5
          done
          oras version
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      # only the `# vmctl-nix:` flavors: their golden is a nix build and nothing else here
      # needs nix. A cache hit skips the build, so this is paid on a miss and on nothing else.
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.flavor.outputs.nix != ''
        with:
          extra-conf: system-features = nixos-test benchmark big-parallel kvm
      - name: the golden image, from the cache or built here
        run: scripts/ci-golden.sh ${{ matrix.flavor }}
      # --record pairs vm/live-smoke.d/capture-from-run with the log by stamp, so every
      # guest command of this run and the bytes it answered land in
      # vm/live-smoke.out/<flavor>-<stamp>-capture.txt. Measured on resolute-sway
      # 2026-09-12: 134 s, 59 pass / 0 fail, a 24 KB capture beside the log -- so about
      # 1 MB across the 38 flavors. Without it every push measures 38 desktops and then
      # deletes the evidence, and tests/fixtures/live/NOT-YET-RUN can never empty.
      - name: vm/live-smoke.sh --pkg --remove --record
        # Heads default to 3; a flavor may pin fewer with `# vmctl-ci-heads:` in its yaml.
        # fedora44-cosmic pins 2: cosmic-comp SIGSEGVs intermittently in llvmpipe's
        # per-output render threads under headless software GL, and one fewer output is
        # one fewer such thread (rung 4, the GL stack; softpipe degrades fedora's cosmic
        # and LP_NUM_THREADS=0 only reduced it -- runs 34704305466/34709568224).
        run: |
          H=$(sed -n 's/^#[[:space:]]*vmctl-ci-heads:[[:space:]]*\([0-9][0-9]*\).*/\1/p' vm/flavors/${{ matrix.flavor }}.yaml | head -1)
          vm/live-smoke.sh ${{ matrix.flavor }} --pkg --remove --record --heads "${H:-3}" --cpus 2 --mem 3G
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke-${{ matrix.flavor }}
          path: vm/live-smoke.out/
          if-no-files-found: ignore

  # What the rig job records, replayed. `--record` leaves every guest command of a run and
  # the bytes it answered beside the log, the `live-smoke-<flavor>` artifact above already
  # ships the whole of vm/live-smoke.out/, and scripts/rig-recordings.sh is what turns that
  # into a tests/fixtures/live/<flavor>-<version>-<phases>-replay.txt: it names the file
  # from the log's own `phases:` line and the capture's `w11-desktop-version:` note, replays
  # it through vm/live-smoke.d/fake-vmctl with FAKE_VMCTL_STRICT=1 in the mode the run was
  # made in, and keeps it only when the replay reproduces the tally the log recorded.
  #
  # This job runs all of that and then throws the fixture away (RIG_REC_OUT and RIG_REC_NYR
  # point at a scratch directory): the 38 files land in ONE commit of their own, and what
  # every push proves here is that the machine behind that commit still works -- on every
  # flavor, against that push's own desktops. A flavor whose rig job never produced an
  # artifact is printed and not counted as a problem; that failure belongs to the rig job.
  #
  # Cost: the replay sets LIVE_SMOKE_SLEEP=0 itself (scripts/rig-recordings.sh -- the
  # phases' sleeps exist for a real compositor, not for a transcript), which replayed nine
  # recordings twice each in 34.7 s on the author's box on 2026-09-12; one flavor is
  # seconds. Nothing depends on this job, and it is a plain job rather than a
  # continue-on-error one because this file no longer has any of those: a replay that goes
  # red is the pipeline behind tests/fixtures/live broken on that push, which is a thing to
  # fix that day.
  recordings:
    needs: [plan, vm]
    # the same "run anyway" the vm job carries: a rig that went red still uploaded its
    # artifact (`if: always()` above), and a recording of a red run is exactly as
    # replayable as one of a green run -- rig-recordings.sh compares against the tally
    # that run's own log recorded, fails included.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}
    name: replay ${{ matrix.flavor }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RIG_REC_GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: flavor
        name: what this flavor installs
        run: |
          y=vm/flavors/${{ matrix.flavor }}.yaml
          echo "distro=$(sed -n 's/^#[[:space:]]*vmctl-distro:[[:space:]]*//p' "$y" | head -1)" >> "$GITHUB_OUTPUT"
      # the same three guarded downloads the rig job does, and for a sharper reason: a
      # --pkg run's recording covers phase_install and phase_remove, and the replay of
      # those needs the package file ON THIS HOST (rig-recordings.sh drops both halves
      # with a printed reason when it is not there, and 12 of the 38 flavors would then
      # replay a third less than they recorded)
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'ubuntu'
        with:
          name: deb
          path: release
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'fedora'
        with:
          name: rpms
          path: dist
      - uses: actions/download-artifact@v4
        if: steps.flavor.outputs.distro == 'arch'
        with:
          name: pkg
          path: dist
      - name: scripts/rig-recordings.sh, into a scratch tree
        run: |
          mkdir -p /tmp/rec
          cp tests/fixtures/live/NOT-YET-RUN /tmp/rec/NOT-YET-RUN
          RIG_REC_OUT=/tmp/rec RIG_REC_NYR=/tmp/rec/NOT-YET-RUN \
              scripts/rig-recordings.sh ${{ github.run_id }} ${{ matrix.flavor }}
          # the fixture is the harvest commit's to land, not this job's: nothing under
          # tests/ may have moved here
          git diff --exit-code -- tests/
